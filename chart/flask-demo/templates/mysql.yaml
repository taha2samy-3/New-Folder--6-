apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo-mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: {{ .Values.db.rootPassword }}
        - name: MYSQL_DATABASE
          value: demo_db
        - name: MYSQL_USER
          value: root
        - name: MYSQL_PASSWORD
          value: {{ .Values.db.password }}
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: flask-demo-mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
