name: Build and Publish Flask App Versions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push V1 (Stable)
      uses: docker/build-push-action@v4
      with:
        context: ./src
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/flask-demo:v1

    - name: Build and Push V2 (Canary)
      uses: docker/build-push-action@v4
      with:
        context: ./src
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/flask-demo:v2
