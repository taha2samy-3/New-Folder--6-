<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Progressive Delivery</title>
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #000); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px; 
            border-radius: 24px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; font-size: 2rem; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 15px 0; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 700; 
            color: white; 
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-user { 
            background: #2563eb; 
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
        }
        .btn-user:hover { box-shadow: 0 6px 20px 0 rgba(37, 99, 235, 0.5); }
        
        .btn-dev { 
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
        }
        .btn-dev:hover { box-shadow: 0 6px 20px 0 rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Welcome</h2>
        <p>Choose your role to enter the system.</p>
        
        <a href="/set-mode/user" class="btn btn-user">👤 Enter as Normal User</a>
        <a href="/set-mode/developer" class="btn btn-dev">🚀 Enter as Developer</a>
    </div>
</body>
</html>
